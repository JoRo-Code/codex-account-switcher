name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python test_launcher.py
      - run: python test_auto.py
      - run: python test_status.py
      - run: python test_update.py
      - run: python test_continue.py
      - run: python test_overview.py
      - run: python test_router.py
      - run: python test_onboarding.py
      - run: python test_setup_window.py
      - run: python codex-accounts --help
